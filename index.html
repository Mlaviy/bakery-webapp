<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекарня - Заказ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .counter {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            background-color: #0088cc;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #orderBtn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>🥐 Свежая выпечка</h2>
    
    <div class="item">
        <span>🥐 Круассан</span>
        <div class="counter">
            <button onclick="change('croissant', -1)">-</button>
            <span id="croissant">0</span>
            <button onclick="change('croissant', 1)">+</button>
        </div>
    </div>

    <div class="item">
        <span>🍩 Эклер</span>
        <div class="counter">
            <button onclick="change('eclair', -1)">-</button>
            <span id="eclair">0</span>
            <button onclick="change('eclair', 1)">+</button>
        </div>
    </div>

    <div class="item">
        <span>🧁 Синнабон</span>
        <div class="counter">
            <button onclick="change('cinnabon', -1)">-</button>
            <span id="cinnabon">0</span>
            <button onclick="change('cinnabon', 1)">+</button>
        </div>
    </div>

    <button id="orderBtn" onclick="sendOrder()">Оформить заказ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let order = { croissant: 0, eclair: 0, cinnabon: 0 };

        function change(item, delta) {
            if (order[item] + delta >= 0) {
                order[item] += delta;
                document.getElementById(item).innerText = order[item];
            }
        }

        function sendOrder() {
            if (order.croissant === 0 && order.eclair === 0 && order.cinnabon === 0) {
                alert("Выберите хотя бы один товар!");
                return;
            }
            tg.sendData(JSON.stringify(order));
        }
    </script>
</body>
</html>
