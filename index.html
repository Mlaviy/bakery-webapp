<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Poste — Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            padding: 16px;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
            max-width: 480px;
            margin: 0 auto;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            scrollbar-width: none;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 10;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            padding: 8px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            background: #ffffff;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #444444;
        }
        .cat-btn.active {
            background: #1a1a1a;
            color: #ffffff;
            border-color: #1a1a1a;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .product-card {
            background: #ffffff;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        
        .img-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f5f5f7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .product-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            line-height: 1.25;
            color: #111;
        }
        
        .product-desc {
            font-size: 11px;
            color: #777777;
            margin-bottom: 10px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 4px;
        }
        
        .price-group {
            display: flex;
            flex-direction: column;
        }
        
        .product-price {
            font-weight: 700;
            font-size: 14px;
        }
        
        .product-weight {
            font-size: 10px;
            color: #999999;
        }

        .add-btn {
            background: #0000d6;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .counter {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #f5f5f7;
            border-radius: 8px;
            padding: 2px;
        }
        
        .counter button {
            border: none;
            background: none;
            font-size: 16px;
            font-weight: bold;
            width: 26px;
            height: 26px;
            cursor: pointer;
            color: #1a1a1a;
        }
        
        .counter span {
            font-size: 12px;
            font-weight: 600;
            min-width: 14px;
            text-align: center;
        }

        .order-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            border-top: 1px solid #f0f0f0;
            z-index: 100;
        }
        
        .main-btn {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .main-btn:disabled {
            background: #e0e0e0;
            color: #a0a0a0;
        }
    </style>
</head>

        let cart = {};
        let currentCategory = 'Хлеб';

        function init() {
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const cats = ['Хлеб', 'Гастрономия', 'Слойка', 'Выпечка и десерты'];
            const container = document.getElementById('categoryContainer');
            container.innerHTML = cats.map(c => 
                `<button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
            ).join('');
        }

        function filterCat(cat) {
            currentCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            const filtered = products.filter(p => p.cat === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">Категория пуста</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const count = cart[p.id] || 0;
                return `
                    <div class="product-card">
                        <div>
                            <div class="img-wrapper">
                                <img src="${p.img}" class="product-img" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.style.display='none';">
                            </div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.desc}</div>
                        </div>
                        <div class="product-footer">
                            <div class="price-group">
                                <span class="product-price">${p.price} ₽</span>
                                <span class="product-weight">${p.weight}</span>
                            </div>
                            ${count === 0 ? 
                                `<button class="add-btn" onclick="changeCount('${p.id}', 1)">+</button>` : 
                                `<div class="counter">
                                    <button onclick="changeCount('${p.id}', -1)">-</button>
                                    <span>${count}</span>
                                    <button onclick="changeCount('${p.id}', 1)">+</button>
                                </div>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeCount(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            renderProducts();
            updateTotal();
        }

        function updateTotal() {
            let totalSum = 0;
            let totalCount = 0;

            for (let id in cart) {
                let p = products.find(prod => prod.id === id);
                if (p) {
                    totalSum += p.price * cart[id];
                    totalCount += cart[id];
                }
            }

            const btn = document.getElementById('orderBtn');
            if (totalCount > 0) {
                btn.innerText = `Оформить заказ (${totalSum} ₽)`;
                btn.disabled = false;
            } else {
                btn.innerText = `Выберите товары (0 ₽)`;
                btn.disabled = true;
            }
        }

        function sendOrder() {
            let items = [];
            let total = 0;

            for (let id in cart) {
                let p = products.find(prod => prod.id === id);
                if (p) {
                    items.push({
                        name: p.name,
                        count: cart[id],
                        price: p.price
                    });
                    total += p.price * cart[id];
                }
            }

            tg.sendData(JSON.stringify({ items: items, total: total }));
        }

        init();
    </script>
</body>
</html>
